[alembic]
script_location = %(here)s/migrations
# La URL NO va aquí: env.py la construye desde variables de entorno (DB_OWNER_*).

[loggers]
keys = root
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARNING
handlers = console
[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic
[formatter_generic]
format = %(levelname)s [%(name)s] %(message)s
