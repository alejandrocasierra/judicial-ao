            evidence_type: documentary
            description: Comprobante de transferencia bancaria por $80.000.000
            document: transferencia
            links: [{fact: f_pago, stance: supports}]
          - key: e_testimonio
            evidence_type: testimonial
            description: Declaración de la testigo en audiencia
            media: audiencia
            links: [{fact: f_pago, stance: neutral}]
        events:
