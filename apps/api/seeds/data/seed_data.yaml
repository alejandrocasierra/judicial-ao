          - {date: "2024-02-01", event_type: answer_filed, description: Contestación de la demanda, timeline_confidence: source_backed, source: {document: contestacion, page: 1}}
          - {date: "2024-03-15", event_type: contract_signed, description: Firma del contrato (según la demanda), timeline_confidence: ambiguous, source: {document: demanda, page: 1}}
          - {date: "2024-03-17", event_type: hearing, description: Audiencia inicial, timeline_confidence: source_backed, source: {media: audiencia, segment: 0}}
          - {date: "2024-04-28", event_type: payment_alleged, description: Transferencia alegada por el demandado, timeline_confidence: source_backed, source: {document: transferencia, page: 1}}
