            source: {document: demanda, page: 1, quote: "El demandado no realizó el pago de $80.000.000"}
          - key: c_pago
            text: El demandado afirma haber realizado el pago el 28 de abril de 2024.
            claim_type: party_assertion
            claimant: demandado
            confidence: 0.93
            source: {document: contestacion, page: 1, quote: "afirma haber realizado el pago de $80.000.000 el 28 de abril de 2024"}
          - key: c_firma_marzo
            text: El contrato se firmó el 15 de marzo de 2024.
            claim_type: party_assertion
            claimant: demandante
            confidence: 0.92
            source: {document: demanda, page: 1, quote: "El 15 de marzo de 2024 se firmó el contrato de suministro"}
          - key: c_firma_mayo
