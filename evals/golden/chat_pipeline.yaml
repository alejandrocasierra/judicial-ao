#   `pilot_manual.yaml` (mismo archivo y página) o datos del seed sintético.
# - `must_not_cite` es la métrica que faltaba: citar una fuente correcta no
#   absuelve de citar cinco irrelevantes.
# - Los casos `navegar` no citan: su salida es una lista de menciones.
