# CI de GitLab: construye y publica las imágenes en el Container Registry del proyecto.
# Luego, en el VPS de GCP:  docker compose pull  &&  docker compose up -d
#
# Variables que aporta GitLab automáticamente: CI_REGISTRY, CI_REGISTRY_IMAGE,
# CI_REGISTRY_USER, CI_REGISTRY_PASSWORD, CI_COMMIT_SHORT_SHA.
stages:
  - build

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"

.build:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"

build:api:
  extends: .build
  script:
    # API, worker y MCP comparten la misma imagen (api.Dockerfile).
    - docker build -f infra/docker/api.Dockerfile -t "$CI_REGISTRY_IMAGE/api:$CI_COMMIT_SHORT_SHA" -t "$CI_REGISTRY_IMAGE/api:latest" .
    - docker push "$CI_REGISTRY_IMAGE/api:$CI_COMMIT_SHORT_SHA"
    - docker push "$CI_REGISTRY_IMAGE/api:latest"

build:web:
  extends: .build
  script:
    - docker build -f infra/docker/web.Dockerfile -t "$CI_REGISTRY_IMAGE/web:$CI_COMMIT_SHORT_SHA" -t "$CI_REGISTRY_IMAGE/web:latest" ./apps/web
    - docker push "$CI_REGISTRY_IMAGE/web:$CI_COMMIT_SHORT_SHA"
    - docker push "$CI_REGISTRY_IMAGE/web:latest"
