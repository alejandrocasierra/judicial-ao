# Politica RBAC como codigo. Permiso efectivo en un expediente =
# permisos del rol de organizacion INTERSECCION permisos del rol en el expediente.
# ORG_ADMIN no requiere membresia del expediente, pero SIEMPRE queda limitado a su
# organizacion por RLS.
version: 1

permissions:
  - case.create
  - case.read
  - case.write
  - case.members.manage
  - document.read
  - document.upload
  - document.download
  - media.read
  - media.upload
  - ai.query
  - ai.graph
  - ai.export
  - review.write
  - legal_hold.manage
  - evidence.deletion_request
  - audit.read
  - audit.run
  - audit.review
  - second_opinion.read
  - second_opinion.run
  - facts.read
  - facts.write
  - facts.review
  - verification_policy.write
  - user.manage
  - job.run

org_roles:
  ORG_ADMIN: ["*"]
  CASE_MANAGER:
    - case.create
    - case.read
    - case.write
    - case.members.manage
    - document.read
    - document.upload
    - document.download
    - media.read
    - media.upload
    - ai.query
    - ai.graph
    - ai.export
    - review.write
    - audit.run
    - audit.review
    - second_opinion.run
    - facts.write
    - facts.review
    - verification_policy.write
    - job.run
  LAWYER:
    - case.create
    - case.read
    - case.write
    - document.read
    - document.upload
    - document.download
    - media.read
    - media.upload
    - ai.query
    - ai.graph
    - ai.export
    - review.write
    - audit.run
    - audit.review
    - second_opinion.run
    - facts.write
    - facts.review
    - job.run
  REVIEWER:
    - case.read
    - document.read
    - document.download
    - media.read
    - ai.query
    - ai.graph
    - review.write
    - audit.review
    - facts.review
  ANALYST:
    - case.read
    - document.read
    - media.read
    - ai.query
    - ai.graph
  READ_ONLY:
    - case.read
    - document.read
    - media.read
  SYSTEM:
    - case.read
    - document.read
    - media.read
    - job.run

case_roles:
  OWNER:
    - case.read
    - case.write
    - case.members.manage
    - document.read
    - document.upload
    - document.download
    - media.read
    - media.upload
    - ai.query
    - ai.graph
    - ai.export
    - review.write
    - audit.run
    - audit.review
    - second_opinion.run
    - facts.write
    - facts.review
    - verification_policy.write
    - job.run
  LAWYER:
    - case.read
    - case.write
    - document.read
    - document.upload
    - document.download
    - media.read
    - media.upload
    - ai.query
    - ai.graph
    - ai.export
    - review.write
    - audit.run
    - audit.review
    - second_opinion.run
    - facts.write
    - facts.review
    - job.run
  REVIEWER:
    - case.read
    - document.read
    - document.download
    - media.read
    - ai.query
    - ai.graph
    - review.write
    - audit.review
    - facts.review
  VIEWER:
    - case.read
    - document.read
    - media.read

# Permisos que solo existen a nivel de organizacion.
org_level_permissions:
  - case.create
  - legal_hold.manage
  - evidence.deletion_request
  - audit.read
  - verification_policy.write
  - user.manage
