[pytest]
testpaths = tests
pythonpath = apps apps/api scripts tests
addopts = -ra --strict-markers
markers =
    unit: pruebas unitarias sin base de datos
    integration: API + PostgreSQL real
    security: pruebas de seguridad (OWASP / multi-tenant / IA)
    behavior: lo que el sistema DEBE y NO DEBE hacer (SSD §132-133)
    static: análisis estático del repositorio
